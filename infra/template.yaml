  MonthEndCloseStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${StackPrefix}-month-end-close"
      DefinitionUri: month_end_close.asl.json
      DefinitionSubstitutions:
        EvaluatorFunctionArn: !GetAtt EvaluatorFunction.Arn
        WriterFunctionArn: !GetAtt WriterFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref EvaluatorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref WriterFunction

Outputs:
  ApiUrl:
    Description: Kerdon MSP HTTP API base URL
    Value: !Sub "https://${KerdonApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  AppTableName:
    Value: !Ref KerdonAppTable
  ApprovalsTableName:
    Value: !Ref KerdonApprovalsTable
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  WebAssetsBucketName:
    Value: !Ref WebAssetsBucket
  WebCdnDistributionId:
    Value: !Ref WebCdnDistribution
  WebAppUrl:
    Description: Kerdon MSP CloudFront + S3 Enterprise SPA URL (Zero-Lambda Static Edge)
    Value: !Sub "https://${WebCdnDistribution.DomainName}/" 
  AgentCoreRuntimeRoleArn:
    Value: !GetAtt AgentCoreRuntimeRole.Arn
  AgentCoreMemoryId:
    Value: !GetAtt AgentCoreMemory.MemoryId
  AgentCoreMemoryArn:
    Value: !GetAtt AgentCoreMemory.MemoryArn
  MonthEndCloseStateMachineArn:
    Value: !Ref MonthEndCloseStateMachine
