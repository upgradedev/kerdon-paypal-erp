            Method: POST
        InvitesPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref KerdonApi
            Path: /tenants/{id}/invites
            Method: POST
        SubscriptionPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref KerdonApi
            Path: /tenants/{id}/billing/subscription
            Method: POST
        InventoryMovementPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref KerdonApi
            Path: /tenants/{id}/inventory/movement
            Method: POST
        PartiesPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref KerdonApi
            Path: /tenants/{id}/parties
            Method: POST
        DraftsPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref KerdonApi
            Path: /tenants/{id}/drafts
            Method: POST
        ExpensesPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref KerdonApi
            Path: /tenants/{id}/expenses
            Method: POST
        ReverseInvoicePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref KerdonApi
            Path: /tenants/{id}/invoices/{doc_id}/reverse
            Method: POST
        ReceiptsPost:
          Type: HttpApi
